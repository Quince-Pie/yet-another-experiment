# Verification shared by CI (every push and pull request) and Release (every
# v* tag): one job per supported system on a native runner, running the same
# `nix flake check` and scripts/release.sh subcommands a maintainer runs
# locally. Each job uploads its verification record (evaluation identities,
# closure sizes, smoke results) for the release manifest.
name: Verify

on:
  workflow_call:

permissions: {}

jobs:
  verify:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix

      - name: Check the flake (evaluates every system, builds this one)
        run: nix flake check --all-systems --no-update-lock-file --print-build-logs

      - name: Smoke-test every dev shell
        env:
          SYSTEM: ${{ matrix.system }}
        run: scripts/release.sh smoke "$SYSTEM"

      - name: Record evaluation identities and closures
        env:
          SYSTEM: ${{ matrix.system }}
        run: scripts/release.sh fragment "$SYSTEM"

      - name: Test the release tooling
        run: tests/test-release.sh

      - name: Upload the verification record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fragment-${{ matrix.system }}
          path: dist/fragment-${{ matrix.system }}.json
          if-no-files-found: error
          retention-days: 7
