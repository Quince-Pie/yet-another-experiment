# Publishes a release for every pushed v* tag. See docs/release-contract.md.
#
#   tag ──> verify (x86_64-linux, aarch64-linux) ──> publish
#
# `tag` fails fast on an unsigned or malformed tag before any runner time is
# spent on the matrix. `publish` is the only job with write permissions: it
# packages the source NAR, assembles release.json from the verification
# records, attests the assets, uploads them to a draft and publishes it.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

# One run per tag; a second push of the same tag waits for the first. Runs
# for different tags may overlap: each publishes its own release, and
# scripts/release.sh refuses to touch a release that already exists.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Verify tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the signature and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release.sh verify-tag "$TAG"
          scripts/release.sh notes "${TAG#v}" >/dev/null

  verify:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  publish:
    name: Publish
    needs: [tag, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # obtain the Sigstore signing certificate
      attestations: write # store the attestation with GitHub
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix

      - name: Download the verification records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fragment-*
          merge-multiple: true
          path: dist

      - name: Package the source and assemble the manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release.sh verify-tag "$TAG"
          scripts/release.sh archive
          scripts/release.sh assemble "$TAG"
          scripts/release.sh crosscheck "$TAG"
          ls -l dist

      - name: Attest the assets
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/yet-another-experiment-*.nar
            dist/release.json
            dist/SHA256SUMS
          create-storage-record: false

      - name: Keep the attestation bundle as a release asset
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/provenance.intoto.jsonl

      - name: Publish the release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(scripts/release.sh publish "$TAG")
          printf '## Released %s\n\n%s\n' "$TAG" "$url" >>"$GITHUB_STEP_SUMMARY"
